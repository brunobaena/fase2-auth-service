# =============================================================================
# MANIFESTO KUBERNETES — auth-service  (com ESO)
# Repositório: brunobaena/fase2-auth-service
# Cluster EKS: fase2-eks  |  Região: us-east-2  |  Account: 997739472885
# =============================================================================

# -----------------------------------------------------------------------------
# 1. NAMESPACE
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: auth
  labels:
    app.kubernetes.io/part-of: togglemaster
    env: production

---
# -----------------------------------------------------------------------------
# 2. CONFIGMAP — variáveis NÃO-sensíveis
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: auth
  labels:
    app: auth-service
data:
  PORT: "8001"
  DB_HOST: "auth-db.cz8iwao2givk.us-east-2.rds.amazonaws.com"
  DB_PORT: "5432"
  POSTGRES_DB: "postgres"

---
# -----------------------------------------------------------------------------
# 3. EXTERNAL SECRET
#    O ESO lê os valores do Secrets Manager e cria/atualiza automaticamente
#    o Secret K8s "auth-service-secret" neste namespace.
#    Nenhum valor sensível fica hardcoded neste arquivo.
# -----------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-service-external-secret
  namespace: auth
  labels:
    app: auth-service
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: togglemaster-aws
    kind: ClusterSecretStore

  target:
    name: auth-service-secret     # nome do Secret K8s que será criado/gerenciado
    creationPolicy: Owner         # ESO é owner — apaga junto se o ExternalSecret for apagado

    template:
      engineVersion: v2
      data:
        POSTGRES_USER:     "{{ .rds_username }}"
        POSTGRES_PASSWORD: "{{ .rds_password }}"
        DATABASE_URL: "postgres://{{ .rds_username }}:{{ .rds_password | urlquery }}@auth-db.cz8iwao2givk.us-east-2.rds.amazonaws.com:5432/postgres"
        MASTER_KEY: "{{ .master_key }}"

  # Mapeamento entre chaves do Secrets Manager e variáveis no Secret K8s
  data:
    - secretKey: rds_username
      remoteRef:
        key: rds!db-bf003a9f-b225-4f3b-9f32-904f6158aadb
        property: username

    - secretKey: rds_password
      remoteRef:
        key: rds!db-bf003a9f-b225-4f3b-9f32-904f6158aadb
        property: password

    - secretKey: master_key
      remoteRef:
        key: togglemaster/auth-service/master-key

---
# -----------------------------------------------------------------------------
# 4. DEPLOYMENT
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: auth
  labels:
    app: auth-service
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        version: "1.0.0"
    spec:
      # Preferência de não colocar dois pods no mesmo nó (HA)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - auth-service
                topologyKey: kubernetes.io/hostname

      containers:
        - name: auth-service
          image: 997739472885.dkr.ecr.us-east-2.amazonaws.com/fiap/auth-service:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
              protocol: TCP

          # -----------------------------------------------------------------
          # Variáveis NÃO-sensíveis — ConfigMap
          # -----------------------------------------------------------------
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: auth-service-config
                  key: PORT
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: auth-service-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: auth-service-config
                  key: DB_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: auth-service-config
                  key: POSTGRES_DB

          # -----------------------------------------------------------------
          # Variáveis SENSÍVEIS — Secret gerenciado pelo ESO
          # -----------------------------------------------------------------
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: DATABASE_URL
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: MASTER_KEY

          # -----------------------------------------------------------------
          # Requests e Limits
          # -----------------------------------------------------------------
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          # -----------------------------------------------------------------
          # ReadinessProbe — o pod só recebe tráfego quando /health retornar 200
          # -----------------------------------------------------------------
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1

          # -----------------------------------------------------------------
          # LivenessProbe — reinicia o container se /health parar de responder
          # -----------------------------------------------------------------
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3

      restartPolicy: Always

---
# -----------------------------------------------------------------------------
# 5. SERVICE — ClusterIP
# DNS interno: http://auth-service.auth.svc.cluster.local:8001
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: auth
  labels:
    app: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - name: http
      protocol: TCP
      port: 8001
      targetPort: 8001
